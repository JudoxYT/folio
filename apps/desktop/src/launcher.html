<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Folio — Mijn websites</title>
<style>
  :root { --bg:#0f1014; --panel:#17181e; --raised:#1f2128; --line:#2a2c35; --text:#eceef4; --muted:#9a9eae; --accent:#8b7bff; --accent2:#5ee0c2; --danger:#ff6b81; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 22px 40px 18px; -webkit-app-region: drag; }
  header button, header a { -webkit-app-region: no-drag; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
  .logo svg { width: 30px; height: 30px; }
  .grow { flex: 1; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 10px; font: inherit; cursor: pointer; }
  .ghost:hover { border-color: #3a3d48; background: var(--raised); }
  .primary { background: var(--accent); color: #0d0b1f; border: 0; padding: 10px 18px; border-radius: 10px; font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow: auto; padding: 8px 40px 48px; }
  h1 { font-size: 30px; letter-spacing: -.03em; margin: 18px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .2s, border-color .2s, box-shadow .2s; }
  .card:hover { transform: translateY(-3px); border-color: #3a3d48; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .thumb { height: 150px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; gap: 8px; overflow: hidden; }
  .thumb i { display: block; height: 8px; border-radius: 4px; opacity: .9; }
  .thumb b { font-size: 20px; letter-spacing: -.02em; line-height: 1.1; }
  .meta { padding: 14px 16px 16px; }
  .meta strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { color: var(--muted); font-size: 12.5px; }
  .more { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 9px; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 18px; cursor: pointer; opacity: 0; transition: opacity .15s; backdrop-filter: blur(6px); }
  .card:hover .more, .more:focus { opacity: 1; }
  .new { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 225px; border: 1.5px dashed #343745; background: transparent; color: var(--muted); }
  .new:hover { color: var(--text); border-color: var(--accent); }
  .new .plus { width: 46px; height: 46px; border-radius: 14px; background: var(--raised); display: grid; place-items: center; font-size: 26px; color: var(--accent); }
  .missing { opacity: .55; }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .menu { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 210px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 9px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  .menu button:hover { background: var(--raised); }
  .menu .danger { color: var(--danger); }
  .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(5,6,10,.7); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 24px; }
  .dialog { width: min(860px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
  .dialog h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.02em; }
  .dialog p { color: var(--muted); margin: 0 0 20px; }
  label.field { display: block; font-weight: 600; margin-bottom: 18px; }
  label.field input { display: block; width: 100%; margin-top: 8px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 15px/1.3 inherit; font-family: inherit; outline: none; }
  label.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.25); }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin: 8px 0 24px; }
  .tpl { border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; background: var(--bg); text-align: left; padding: 0; color: var(--text); font: inherit; }
  .tpl .thumb { height: 96px; padding: 12px; }
  .tpl .thumb b { font-size: 15px; }
  .tpl .txt { padding: 10px 12px 12px; }
  .tpl .txt strong { display: block; }
  .tpl .txt span { color: var(--muted); font-size: 12px; line-height: 1.35; display: block; margin-top: 2px; }
  .tpl.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.25); }
  .row { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .busy { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(15,16,20,.85); backdrop-filter: blur(4px); }
  .busy div { text-align: center; }
  .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #2d2f3a; border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .banner { margin: 0 40px; padding: 12px 16px; border-radius: 12px; background: rgba(94,224,194,.12); border: 1px solid rgba(94,224,194,.35); display: flex; gap: 12px; align-items: center; }
  .banner[hidden] { display: none; }
  footer { padding: 10px 40px 16px; color: #5d6170; font-size: 12px; display: flex; gap: 16px; }
  footer a { color: inherit; }
  .error { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; background: var(--bg); padding: 12px; border-radius: 10px; color: #ffb3bf; max-height: 240px; overflow: auto; }
.note { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1d1b2e; color: #fff; border: 1px solid #8b7bff66; padding: 12px 18px; border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 50; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="20" height="24" rx="5" fill="#5ee0c2" opacity=".55"/><rect x="9" y="3" width="20" height="24" rx="5" fill="#8b7bff"/><rect x="14" y="10" width="10" height="2.6" rx="1.3" fill="#0d0b1f"/><rect x="14" y="15" width="7" height="2.6" rx="1.3" fill="#0d0b1f"/></svg>
    Folio
  </div>
  <div class="grow"></div>
  <button class="ghost" id="import-file" title="Een .folio-bestand dat iemand met je gedeeld heeft">Folio-bestand openen…</button>
  <button class="ghost" id="import">Website openen uit map…</button>
  <button class="primary" id="new">+ Nieuwe website</button>
</header>
<div class="banner" id="update" hidden></div>
<main>
  <h1>Mijn websites</h1>
  <p class="sub">Kies een website om te bewerken, of begin een nieuwe.</p>
  <div class="grid" id="grid"></div>
</main>
<footer><span id="ver"></span><span id="root"></span></footer>
<script src="launcher.js"></script>
</body>
</html>
